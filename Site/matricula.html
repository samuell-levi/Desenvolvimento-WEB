<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Matrícula</title>
</head>
<body>

  <h1>Formulário de Matrícula</h1>

  <form action="#" method="POST">
    
    <fieldset>
      <legend>Dados Pessoais</legend>

      <p>
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" required>
      </p>

      <p>
        <label for="matricula">Matrícula:</label><br>
        <input type="text" id="matricula" name="matricula" pattern="[0-9]{6}" title="Digite 6 números" required>
      </p>

      <p>
        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required>
      </p>

      <p>
        <label for="nascimento">Data de Nascimento:</label><br>
        <input type="date" id="nascimento" name="nascimento" required>
      </p>

      <p>
        <label for="comprovante">Comprovante de Residência:</label><br>
        <input type="file" id="comprovante" name="comprovante" required>
      </p>
    </fieldset>

    <br>

    <fieldset>
      <legend>Opções de Matrícula</legend>

      <p>
        <label for="curso">Curso:</label><br>
        <select id="curso" name="curso" required>
          <option value="">Selecione...</option>
          <option value="ads">Análise e Desenvolvimento de Sistemas</option>
          <option value="si">Sistemas de Informação</option>
          <option value="cc">Ciência da Computação</option>
        </select>
      </p>

      <p>
        <label>Turno:</label><br>
        <input type="radio" id="manha" name="turno" value="manha" required>
        <label for="manha">Manhã</label>
        
        <input type="radio" id="noite" name="turno" value="noite">
        <label for="noite">Noite</label>
      </p>

      <p>
        <label for="termos">
          <input type="checkbox" id="termos" name="termos" required>
          Concordo com os termos do curso.
        </label>
      </p>
    </fieldset>

    <br>

    <button type="submit">Enviar</button>

  </form>

</body>
</html>
